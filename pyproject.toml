[project]
name = "rag-project1"
version = "0.1.0"
description = "Small RAG app for product manuals"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.16",
    "certifi>=2026.1.4",
    "langwatch>=1.0.0",
    "llama-index>=0.12.52",
    "llama-index-embeddings-openai>=0.3.3",
    "llama-index-llms-openai-like>=0.3.3",
    "llama-index-vector-stores-chroma>=0.4.2",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "streamlit>=1.47.1",
    "openinference-instrumentation-llama-index>=4.4.4",
]

[project.scripts]
rag-project1 = "main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.7",
]
